name: M0 gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  m0:
    name: Node 22 + Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # better-sqlite3 在 npm ci 时由 node-gyp 从源码编译，需要 python3 / make / g++。
      # ubuntu-latest 已自带；这一步让缺工具链的镜像尽早、清楚地失败。见 CONTRIBUTING.md。
      - name: Check native build toolchain (better-sqlite3)
        run: |
          python3 --version
          make --version | head -n 1
          g++ --version | head -n 1

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # npm test 已包含全部单元与契约测试，不重复执行 test:unit / test:contract。
      # 硬规则（原文不覆盖、可溯源、世界线隔离、坏输出 fail closed）由单元 / 合约 / E2E 测试阻塞。
      # 真实模型质量评测是不阻塞的仪表盘，不进默认 CI（docs/decisions/0005-eval-dashboard-not-gate.md）。
      - name: Full Vitest suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: CI=1 npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
